version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: questlog
    ports:
      - "5432:5432"

  questlog:
    build: .
    volumes:
      - .:/questlog
    env_file:
      - .env.docker  # make sure you created that one from .env.example
    depends_on:
      - db
    ports:
      - "8000:8000"
